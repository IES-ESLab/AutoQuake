# Codespaces / devcontainer conda environment.
#
# Mirrors env.yml (the local/CI source of truth) with two deliberate changes:
#   1. CPU-only PyTorch  -> Codespaces has no GPU and the CUDA build is ~2 GB larger.
#   2. Jupyter tooling   -> interactive online development.
#
# Keep the core dependency list below in sync with env.yml when it changes.
name: AutoQuake_v0
channels:
  - conda-forge
dependencies:
  # --- core (mirrors env.yml) ---
  - python==3.10.13
  - numpy>=1.21.6
  - pandas
  - scikit-learn>=1.6.0
  - tqdm
  - matplotlib
  - h5py
  - obspy>=1.3.1
  - scipy
  - fsspec
  - numba
  - pydantic
  - pyproj
  - onnx
  - onnxruntime
  - pytest
  - pytest-cov
  # --- visualization (imported by autoquake's plotting modules) ---
  - pygmt
  - cartopy
  # --- interactive dev (Codespaces only) ---
  - ipykernel
  - jupyterlab
  - pip
  - pip:
    # CPU-only PyTorch: much smaller than the CUDA build, and Codespaces has no GPU.
    - torch --index-url https://download.pytorch.org/whl/cpu
    - torchvision --index-url https://download.pytorch.org/whl/cpu
